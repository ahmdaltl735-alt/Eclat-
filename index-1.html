<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#000c2d"><meta name="description" content="منيو ÉCLAT Sweets — حلويات فاخرة بنكهات مختارة وتقديم أنيق."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Naskh+Arabic:wght@500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><title>ÉCLAT Sweets | حلويات تليق بلحظاتكم</title><style id="app-css">.public-site, .admin-page, .admin-loading, .permission-page { background: #000c2d; color: #fff; min-height: 100dvh; }
.public-site { background-image: linear-gradient(rgba(201,162,39,.025) 1px, transparent 1px); background-size: 100% 80px; }

.site-header {
  position: sticky;
  top: 0;
  z-index: 40;
  padding-top: env(safe-area-inset-top);
  background: rgba(0, 12, 45, .92);
  border-bottom: 1px solid rgba(201, 162, 39, .25);
  backdrop-filter: blur(16px);
}
.header-inner {
  width: min(100% - 32px, 1380px);
  min-height: 76px;
  margin-inline: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.brand-logo { direction: ltr; display: inline-flex; align-items: center; gap: 10px; color: #c9a227; min-height: 44px; flex-shrink: 0; }
.brand-mark { width: 28px; height: 32px; }
.brand-type { display: flex; flex-direction: column; align-items: center; }
.brand-name { font-family: "Marcellus", serif; font-size: 27px; letter-spacing: .12em; line-height: 1; }
.brand-subtitle { font-family: "Marcellus", serif; color: #fff; font-size: 9px; letter-spacing: .52em; margin-top: 7px; margin-left: .52em; line-height: 1; }
.desktop-nav { display: none; align-items: center; gap: 36px; }
.desktop-nav a, .footer-nav a { position: relative; min-height: 44px; display: inline-flex; align-items: center; font-size: 15px; color: #fff; }
.desktop-nav a::after, .footer-nav a::after {
  content: ""; position: absolute; bottom: 6px; right: 0; width: 100%; height: 1px; background: #c9a227;
  transform: scaleX(0); transform-origin: right; transition: transform 220ms ease-out;
}
.desktop-nav a:hover::after, .footer-nav a:hover::after { transform: scaleX(1); }
.admin-link { display: none; align-items: center; gap: 8px; min-height: 44px; color: #bfc2cb; font-size: 14px; transition: color 180ms ease-out; }
.admin-link:hover { color: #c9a227; }
.mobile-menu-button { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid rgba(201,162,39,.5); background: transparent; color: #c9a227; }
.mobile-nav { display: grid; padding: 8px 20px 20px; border-top: 1px solid rgba(201,162,39,.18); }
.mobile-nav a { min-height: 48px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(255,255,255,.09); }

.hero { display: grid; min-height: calc(100dvh - 76px); }
.hero-copy { padding: 56px 24px 48px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
.hero-kicker, .section-kicker { margin: 0 0 22px; color: #c9a227; font-family: "Marcellus", "Noto Sans Arabic", serif; font-size: 12px; letter-spacing: .17em; line-height: 1.7; }
.hero h1 { margin: 0; max-width: 650px; font-family: "Noto Naskh Arabic", serif; font-size: clamp(46px, 12vw, 68px); font-weight: 600; line-height: 1.2; letter-spacing: -.035em; }
.hero h1 em { color: #c9a227; font-style: normal; font-weight: 500; }
.hero-description { max-width: 540px; margin: 24px 0 30px; color: #bfc2cb; font-size: 17px; line-height: 1.9; }
.button-primary, .button-outline {
  min-height: 48px; padding: 12px 26px; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  border: 1px solid #c9a227; border-radius: 0; font-weight: 600; line-height: 1.4; transition: background-color 200ms ease-out, color 200ms ease-out, transform 200ms ease-out;
}
.button-primary { background: #c9a227; color: #000c2d; }
.button-primary:hover { background: #f5eee1; border-color: #f5eee1; }
.button-outline { background: transparent; color: #c9a227; }
.button-outline:hover { background: #c9a227; color: #000c2d; }
.button-primary:active, .button-outline:active { transform: scale(.98); }
.hero-footnote { margin-top: 44px; display: flex; align-items: center; flex-wrap: wrap; gap: 12px; direction: ltr; color: #bfc2cb; font-family: "Marcellus", serif; font-size: 12px; letter-spacing: .12em; }
.fine-line { width: 32px; height: 1px; background: #c9a227; }
.hero-visual { position: relative; min-height: 460px; margin: 0; overflow: hidden; background: #07101f; }
.hero-visual > img { width: 100%; height: 100%; position: absolute; inset: 0; object-fit: cover; object-position: center; }
.hero-image-shade { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 48%, rgba(0,12,45,.9) 100%); }
.hero-featured { position: absolute; right: 20px; left: 20px; bottom: 22px; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 2px 20px; color: #fff; }
.hero-featured > span:first-child { grid-column: 1 / -1; color: #c9a227; font-size: 13px; }
.hero-featured strong { font-family: "Noto Naskh Arabic", serif; font-size: 26px; font-weight: 600; }
.featured-price { direction: ltr; font-family: "Marcellus", serif; color: #c9a227; font-size: 28px; }
.featured-price b { font-size: 17px; font-weight: 400; }

.menu-section { position: relative; width: min(100% - 40px, 1280px); margin-inline: auto; padding-block: 84px 100px; scroll-margin-top: 76px; }
.vertical-label { display: none; }
.section-heading { display: grid; gap: 18px; margin-bottom: 32px; }
.section-heading h2, .story-intro h2, .closing-section h2 { margin: 0; font-family: "Noto Naskh Arabic", serif; font-size: clamp(36px, 8vw, 56px); font-weight: 600; line-height: 1.35; letter-spacing: -.025em; }
.section-heading .section-kicker { margin-bottom: 8px; font-family: "Noto Sans Arabic", sans-serif; letter-spacing: 0; }
.section-heading > p { margin: 0; max-width: 440px; color: #bfc2cb; line-height: 1.9; }
.category-filter { display: flex; gap: 8px; overflow-x: auto; padding: 4px 4px 18px; margin: 0 -4px 22px; scrollbar-width: thin; }
.category-filter button { flex: 0 0 auto; min-height: 44px; padding: 9px 20px; border: 1px solid rgba(191,194,203,.35); border-radius: 999px; background: transparent; color: #bfc2cb; font-size: 14px; transition: color 180ms ease-out, border-color 180ms ease-out, background-color 180ms ease-out; }
.category-filter button:hover { border-color: #c9a227; color: #c9a227; }
.category-filter button.active { background: #c9a227; border-color: #c9a227; color: #000c2d; font-weight: 600; }
.menu-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 52px; }
.dessert-item { min-width: 0; border-top: 1px solid rgba(201,162,39,.35); padding-top: 12px; }
.dessert-image { margin: 0 0 22px; aspect-ratio: 4 / 3; overflow: hidden; background: #07101f; }
.dessert-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 260ms ease-out, filter 260ms ease-out; }
.dessert-item:hover .dessert-image img { transform: translateY(-4px) scale(1.025); filter: saturate(1.06); }
.dessert-content { display: grid; grid-template-columns: 1fr auto; gap: 12px 20px; }
.dessert-heading p { margin: 0 0 4px; color: #c9a227; font-size: 13px; }
.dessert-heading h3 { display: inline; margin: 0; font-family: "Noto Naskh Arabic", serif; font-size: 29px; font-weight: 600; line-height: 1.4; text-decoration: underline; text-decoration-color: transparent; text-decoration-thickness: 1px; text-underline-offset: 6px; transition: text-decoration-color 220ms ease-out; }
.dessert-item:hover h3 { text-decoration-color: #c9a227; }
.dessert-description { grid-column: 1 / -1; margin: 0; max-width: 62ch; color: #bfc2cb; font-size: 15px; line-height: 1.85; }
.dessert-price { direction: ltr; display: flex; align-items: baseline; gap: 7px; color: #c9a227; font-family: "Marcellus", serif; }
.dessert-price strong { font-size: 34px; font-weight: 400; line-height: 1.2; }
.dessert-price span { font-size: 18px; }
.menu-loading { display: grid; gap: 24px; }
.menu-skeleton { height: 360px; background: linear-gradient(100deg, rgba(255,255,255,.04), rgba(255,255,255,.09), rgba(255,255,255,.04)); background-size: 200% 100%; animation: skeleton 1.5s linear infinite; }
@keyframes skeleton { to { background-position-x: -200%; } }
.menu-message { min-height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border-block: 1px solid rgba(201,162,39,.25); }
.menu-message h3 { margin: 0 0 8px; font-family: "Noto Naskh Arabic", serif; font-size: 28px; }
.menu-message p { color: #bfc2cb; }
.text-button { min-height: 44px; background: transparent; color: #c9a227; text-decoration: underline; text-underline-offset: 5px; }

.story-section { background: #f5eee1; color: #000c2d; padding: 76px 24px; display: grid; gap: 54px; scroll-margin-top: 76px; }
.story-intro { max-width: 600px; }
.story-intro .section-kicker { color: #806717; font-family: "Marcellus", serif; }
.story-intro > p:last-child { max-width: 55ch; margin: 24px 0 0; color: #293247; line-height: 1.9; }
.story-values { display: grid; gap: 30px; }
.story-values > div { border-top: 1px solid rgba(0,12,45,.28); padding-top: 18px; }
.story-values span { direction: ltr; display: block; color: #806717; font-family: "Marcellus", serif; font-size: 13px; }
.story-values h3 { margin: 10px 0 6px; font-family: "Noto Naskh Arabic", serif; font-size: 25px; }
.story-values p { margin: 0; color: #293247; font-size: 15px; }

.closing-section { width: min(100% - 40px, 1000px); margin-inline: auto; padding: 90px 0; text-align: center; display: flex; flex-direction: column; align-items: center; }
.closing-section > p { margin: 0 0 12px; color: #c9a227; }
.closing-section h2 { max-width: 780px; margin-bottom: 30px; }
.site-footer { padding: 42px 24px calc(42px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(201,162,39,.28); display: grid; justify-items: center; gap: 30px; }
.footer-nav { display: flex; gap: 26px; order: 2; }
.footer-handle { order: 3; margin: 0; display: flex; flex-direction: column; align-items: center; color: #bfc2cb; font-size: 13px; }
.footer-handle strong { color: #c9a227; font-family: "Marcellus", serif; font-size: 18px; font-weight: 400; }

.admin-header { min-height: 76px; padding: 12px max(20px, calc((100vw - 1240px)/2)); border-bottom: 1px solid rgba(201,162,39,.25); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.admin-header-actions { display: flex; align-items: center; gap: 4px; }
.button-quiet { min-height: 44px; padding: 8px 10px; display: inline-flex; align-items: center; gap: 7px; background: transparent; border: 0; color: #bfc2cb; font-size: 14px; transition: color 180ms ease-out; }
.button-quiet:hover { color: #c9a227; }
.admin-main { width: min(100% - 40px, 1180px); margin-inline: auto; padding-block: 46px 80px; }
.admin-title-row { display: flex; flex-direction: column; align-items: flex-start; gap: 24px; margin-bottom: 36px; }
.admin-title-row p { margin: 0; color: #c9a227; font-size: 13px; }
.admin-title-row h1 { margin: 2px 0 6px; font-family: "Noto Naskh Arabic", serif; font-size: 43px; line-height: 1.35; }
.admin-title-row span { color: #bfc2cb; font-size: 14px; }
.add-item-button { min-height: 48px !important; padding-inline: 22px !important; background: #c9a227 !important; color: #000c2d !important; border-radius: 0 !important; font-weight: 700 !important; }
.add-item-button:hover { background: #f5eee1 !important; }
.admin-item-list { border-bottom: 1px solid rgba(201,162,39,.25); }
.admin-item-row { display: grid; grid-template-columns: 72px minmax(0,1fr); gap: 16px; padding-block: 20px; border-top: 1px solid rgba(201,162,39,.25); align-items: center; }
.admin-item-row > img, .admin-no-image { width: 72px; height: 72px; object-fit: cover; background: #07101f; }
.admin-no-image { display: grid; place-items: center; color: #c9a227; }
.admin-item-row.is-hidden > img, .admin-item-row.is-hidden .admin-item-info { opacity: .55; }
.admin-item-info > div { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.admin-item-info h2 { margin: 0; font-family: "Noto Naskh Arabic", serif; font-size: 23px; font-weight: 600; }
.admin-item-info p { margin: 2px 0 0; color: #bfc2cb; font-size: 14px; }
.hidden-badge { padding: 1px 8px; border: 1px solid #bfc2cb; border-radius: 999px; color: #bfc2cb; font-size: 12px; }
.admin-item-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
.admin-item-actions button { min-height: 44px; }
.delete-button { color: #ff9c92 !important; }
.admin-list-loading, .admin-error, .admin-empty, .admin-loading, .permission-page { min-height: 55dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 30px; }
.admin-loading p, .permission-page p { color: #bfc2cb; }
.permission-page h1, .admin-empty h2 { margin: 0; font-family: "Noto Naskh Arabic", serif; font-size: 34px; }
.permission-page > div { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.admin-empty { border-block: 1px solid rgba(201,162,39,.25); }
.admin-empty p { color: #bfc2cb; }
.admin-dialog { background: #071633 !important; color: #fff !important; border: 1px solid rgba(201,162,39,.45) !important; border-radius: 4px !important; }
.admin-dialog [data-slot="dialog-close"] { left: 12px; right: auto; top: 12px; width: 44px; height: 44px; display: grid; place-items: center; color: #fff; }
.admin-dialog [data-slot="dialog-title"], .admin-dialog [data-slot="alert-dialog-title"] { font-family: "Noto Naskh Arabic", serif; font-size: 26px; text-align: right; }
.admin-dialog [data-slot="dialog-description"], .admin-dialog [data-slot="alert-dialog-description"] { color: #bfc2cb; text-align: right; line-height: 1.7; }
.item-editor { max-width: 720px !important; max-height: 90dvh; overflow-y: auto; padding: 26px !important; }
.item-form { display: grid; gap: 22px; }
.image-upload-area { display: grid; justify-items: center; gap: 10px; }
.image-upload-area > img, .image-placeholder { width: 100%; height: 210px; object-fit: cover; background: #000c2d; }
.image-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #bfc2cb; border: 1px dashed rgba(201,162,39,.5); }
.upload-button { min-height: 44px; padding: 9px 18px; display: inline-flex; align-items: center; gap: 8px; border: 1px solid #c9a227; color: #c9a227; cursor: pointer; transition: background-color 180ms ease-out, color 180ms ease-out; }
.upload-button:hover, .upload-button:focus-within { background: #c9a227; color: #000c2d; }
.upload-button input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.image-upload-area small { color: #bfc2cb; font-size: 12px; }
.form-grid { display: grid; grid-template-columns: minmax(0,1fr); gap: 18px; }
.field { display: grid; gap: 7px; }
.field label { color: #f5eee1; font-size: 14px; }
.field input, .field textarea, .field select { width: 100%; min-height: 48px; border: 1px solid rgba(191,194,203,.35); border-radius: 0; background: #000c2d; color: #fff; padding: 11px 13px; font-size: 16px; }
.field textarea { min-height: 104px; resize: vertical; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: #c9a227; }
.visibility-check { min-height: 44px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
.visibility-check input { width: 20px; height: 20px; accent-color: #c9a227; }
.form-error { margin: 0; padding: 10px 12px; border: 1px solid #ff9c92; color: #ffb9b2; background: rgba(255,100,90,.08); }
.item-form [data-slot="dialog-footer"] { gap: 10px; }
.item-form [data-slot="dialog-footer"] button, .admin-dialog [data-slot="alert-dialog-footer"] button { min-height: 44px; }
.confirm-delete { background: #b63e35 !important; color: #fff !important; }
.site-toast { direction: rtl; font-family: "Noto Sans Arabic", sans-serif !important; background: #f5eee1 !important; color: #000c2d !important; border: 1px solid #c9a227 !important; border-radius: 2px !important; }

@media (min-width: 640px) {
  .header-inner { width: min(100% - 48px, 1380px); }
  .hero-copy { padding-inline: 48px; }
  .hero-featured { right: 32px; left: 32px; bottom: 32px; }
  .menu-section { width: min(100% - 64px, 1280px); }
  .section-heading { grid-template-columns: 1fr auto; align-items: end; }
  .menu-grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 54px 28px; }
  .menu-loading { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .story-section { padding-inline: 48px; }
  .story-values { grid-template-columns: repeat(3, minmax(0,1fr)); gap: 24px; }
  .site-footer { grid-template-columns: 1fr auto 1fr; align-items: center; justify-items: initial; }
  .site-footer .brand-logo { justify-self: center; }
  .footer-nav { order: initial; }
  .footer-handle { order: initial; justify-self: end; align-items: flex-end; }
  .admin-title-row { flex-direction: row; align-items: center; justify-content: space-between; }
  .admin-item-row { grid-template-columns: 88px minmax(0,1fr) auto; }
  .admin-item-row > img, .admin-no-image { width: 88px; height: 88px; }
  .admin-item-actions { grid-column: auto; justify-content: flex-end; }
  .form-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .field-full { grid-column: 1 / -1; }
}

@media (min-width: 900px) {
  .header-inner { min-height: 84px; }
  .desktop-nav, .admin-link { display: flex; }
  .mobile-menu-button, .mobile-nav { display: none; }
  .brand-mark { width: 32px; height: 37px; }
  .brand-name { font-size: 30px; }
  .hero { grid-template-columns: minmax(0, .94fr) minmax(0, 1.06fr); }
  .hero-copy { padding: 70px clamp(48px, 6vw, 100px); }
  .hero h1 { font-size: clamp(60px, 6.2vw, 88px); }
  .hero-visual { min-height: calc(100dvh - 84px); max-height: 900px; }
  .hero-featured { right: 44px; left: 44px; bottom: 44px; }
  .menu-section { padding-block: 120px 140px; }
  .vertical-label { display: block; position: absolute; left: -54px; top: 138px; writing-mode: vertical-rl; transform: rotate(180deg); color: #c9a227; font-family: "Marcellus", serif; font-size: 12px; letter-spacing: .28em; }
  .section-heading { margin-bottom: 42px; }
  .category-filter { margin-bottom: 36px; }
  .menu-grid { grid-template-columns: repeat(12, minmax(0,1fr)); gap: 74px 32px; }
  .dessert-item { grid-column: span 6; }
  .dessert-item:nth-child(5n + 1) { grid-column: span 7; }
  .dessert-item:nth-child(5n + 2) { grid-column: span 5; }
  .dessert-item:nth-child(5n + 3) { grid-column: span 5; }
  .dessert-item:nth-child(5n + 4) { grid-column: span 7; }
  .dessert-item:nth-child(5n + 5) { grid-column: 3 / span 8; }
  .dessert-item:nth-child(5n + 1) .dessert-image, .dessert-item:nth-child(5n + 4) .dessert-image { aspect-ratio: 16 / 11; }
  .dessert-item:nth-child(5n + 2) .dessert-image, .dessert-item:nth-child(5n + 3) .dessert-image { aspect-ratio: 4 / 4.4; }
  .dessert-item:nth-child(5n + 5) .dessert-image { aspect-ratio: 16 / 8; }
  .dessert-description { font-size: 16px; }
  .story-section { padding: 110px max(64px, calc((100vw - 1280px)/2)); grid-template-columns: minmax(0,1.05fr) minmax(0,.95fr); align-items: end; gap: 70px; }
  .story-values { gap: 20px; }
  .closing-section { padding-block: 120px; }
  .site-footer { padding-inline: max(48px, calc((100vw - 1380px)/2)); }
  .admin-header { min-height: 84px; }
  .admin-main { padding-top: 58px; }
}

@media (min-width: 1380px) {
  .vertical-label { left: -74px; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:88px;color-scheme:dark;background:#000c2d}
:root{padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-width:320px;min-height:100dvh;background:#000c2d;color:#f5eee1;font-family:"Noto Sans Arabic",system-ui,sans-serif;font-size:16px;line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,a,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
::selection{background:#c9a227;color:#000c2d}:focus-visible{outline:2px solid #c9a227;outline-offset:4px}
.admin-page{position:fixed;inset:0;overflow:auto;z-index:60}
.modal-back{position:fixed;inset:0;z-index:80;background:rgba(0,6,24,.74);display:grid;place-items:center;padding:16px}
.admin-dialog{width:100%}
.dlg-title{font-family:"Noto Naskh Arabic",serif;font-size:26px;margin:0 0 14px}
.dlg-foot{display:flex;gap:10px;flex-wrap:wrap}
.btn-gold,.btn-line{min-height:44px;padding:8px 18px;border:1px solid #c9a227;font-weight:600;border-radius:0}
.btn-gold{background:#c9a227;color:#000c2d}.btn-gold:disabled{opacity:.4;cursor:not-allowed}
.btn-line{background:transparent;color:#c9a227}.btn-line:hover{background:rgba(201,162,39,.12)}
.pub-note{font-size:13px;color:#bfc2cb}.pub-note.dirty{color:#ffd86b}

var rows=state.items.map(function(i){var d=delId===i.id;return '<article class="admin-item-row'+(i.active?'':' is-hidden')+'">'+(i.image?'<img src="'+esc(i.image)+'" alt="">':'<div class="admin-no-image">＋</div>')+'<div class="admin-item-info"><div><h2>'+esc(i.name)+'</h2>'+(i.active?'':'<span class="hidden-badge">مخفي</span>')+'</div><p>'+esc(i.category)+' · <bdi>'+fmt(i.price)+' ₪</bdi></p></div><div class="admin-item-actions"><button type="button" class="btn-line" data-act="edit" data-id="'+i.id+'">تعديل</button><button type="button" class="btn-line" data-act="toggle" data-id="'+i.id+'">'+(i.active?'إخفاء':'إظهار')+'</button><button type="button" class="btn-line delete-button" data-act="del" data-id="'+i.id+'">'+(d?'تأكيد الحذف؟':'حذف')+'</button></div></article>'}).join('');
el.innerHTML='<div class="admin-page" dir="rtl"><header class="admin-header">'+logo(1)+'<div class="admin-header-actions"><span class="pub-note'+(dirty?' dirty':'')+'">'+(dirty?'تعديلات غير منشورة':'كل شيء منشور')+'</span><button type="button" class="btn-gold" data-act="pub"'+(dirty&&!saving?'':' disabled')+'>'+(saving?'جارٍ النشر…':'نشر التعديلات')+'</button><button type="button" class="button-quiet" data-act="close">عرض الموقع</button></div></header><main class="admin-main"><div class="admin-title-row"><div><p>لوحة صاحب الموقع</p><h1>إدارة المنيو</h1><span>عدّل الأصناف ثم اضغط «نشر التعديلات» لتظهر للزوار.</span></div><button type="button" class="add-item-button" data-act="add">＋ إضافة صنف</button></div><div class="admin-item-list" style="margin-bottom:28px"><article class="admin-item-row"><img src="'+esc(state.hero)+'" alt=""><div class="admin-item-info"><div><h2>صورة واجهة الموقع</h2></div><p>الصورة الكبيرة في أعلى الصفحة</p></div><div class="admin-item-actions"><label class="upload-button">تغيير الصورة<input id="himg" type="file" accept="image/jpeg,image/png,image/webp"></label></div></article></div>'+(rows?'<div class="admin-item-list">'+rows+'</div>':'<div class="admin-empty"><h2>المنيو فارغ</h2><p>أضف أول صنف ليظهر على الموقع.</p></div>')+'</main></div>'+modal()}
function blank(){return{id:0,name:'',description:'',price:'',category:CATS[0],image:'',active:true}}
function saveForm(){
var p=Number(form.price);
if(form.name.trim().length<2||form.description.trim().length<2){err='أدخل اسم الصنف ووصفه.';return admin()}
if(!isFinite(p)||p<=0){err='أدخل سعرًا صحيحًا أكبر من صفر.';return admin()}
var it={id:form.id||Date.now(),name:form.name.trim(),description:form.description.trim(),price:p,category:form.category,image:form.image||'',active:form.active};
if(form.id)state.items=state.items.map(function(x){return x.id===form.id?it:x});else state.items.push(it);
form=null;err='';dirty=true;admin();menu()}
function buildDoc(){
var d=JSON.stringify(state).replace(/</g,'\\u003c'),E='</scr'+'ipt>';
return '<!doctype html>\n<html lang="ar" dir="rtl"><head>'+HEAD+'<style id="app-css">'+$('#app-css').textContent+'</style></head><body><div id="root"></div><div id="adm"></div><script id="menu-data" type="application/json">'+d+E+'<script id="app-js">'+$('#app-js').textContent+E+'</body></html>'}
async function publish(){
if(saving||!dirty)return;saving=true;admin();
try{var a=await claude.use('artifact');location.hash='admin';await a.publish(buildDoc())}
catch(e){saving=false;admin();toast(e&&(e.code==='not_writer'||e.code==='not_granted')?'ليست لديك صلاحية تعديل هذا الموقع':'تعذر النشر، حاول مرة أخرى')}}
function readImg(f,hero){
if(!/^image\/(jpeg|png|webp)$/.test(f.type)){err='اختر صورة بصيغة JPG أو PNG أو WebP.';if(hero)toast(err);return admin()}
var r=new FileReader();
r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,(hero?1400:1000)/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);var u=c.toDataURL('image/webp',.82);if(hero){state.hero=u;dirty=true;var hi=$('.hero-visual>img');if(hi)hi.src=u}else form.image=u;err='';admin()};im.onerror=function(){err='تعذر قراءة الصورة.';admin()};im.src=r.result};
r.readAsDataURL(f)}
function openAdmin(){open=true;var n=$('#mnav');if(n)n.style.display='none';admin()}
document.addEventListener('click',function(e){
var t=e.target.closest('[data-act],[data-cat],#mm,.mobile-nav a');if(!t)return;
if(t.dataset.cat){cat=t.dataset.cat;menu();return}
if(t.id==='mm'){var n=$('#mnav');n.style.display=n.style.display==='grid'?'none':'grid';return}
if(!t.dataset.act){$('#mnav').style.display='none';return}
var id=Number(t.dataset.id),it=state.items.filter(function(x){return x.id===id})[0];
if(t.dataset.act!=='del')delId=null;
switch(t.dataset.act){
case'open':openAdmin();break;
case'close':open=false;if(location.hash==='#admin')location.hash='menu';admin();if(dirty)toast('لم تُنشر التعديلات بعد');break;
case'add':form=blank();err='';admin();break;
case'edit':form=Object.assign({},it);err='';admin();break;
case'toggle':it.active=!it.active;dirty=true;admin();menu();break;
case'del':if(delId===id){state.items=state.items.filter(function(x){return x.id!==id});delId=null;dirty=true;admin();menu()}else{delId=id;admin()}break;
case'cancel':form=null;err='';admin();break;
case'save':saveForm();break;
case'pub':publish();break}});
function onField(e){var t=e.target;if(t.id==='himg'&&e.type==='change'&&t.files[0]){readImg(t.files[0],1);return}if(t.id==='img'&&e.type==='change'&&t.files[0]){readImg(t.files[0]);return}
if(form&&t.dataset&&t.dataset.f)form[t.dataset.f]=t.type==='checkbox'?t.checked:t.value}
document.addEventListener('input',onField);document.addEventListener('change',onField);
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(form){form=null;admin()}var n=$('#mnav');if(n)n.style.display='none'}});
window.addEventListener('beforeunload',function(e){if(dirty&&!saving){e.preventDefault();e.returnValue=''}});
site();
(async function(){try{
if(!(window.claude&&claude.use))return;
var u=await claude.use('user'),a=await claude.use('artifact');
if(u&&a&&((await u.isOwner())||(await u.canEdit()))){can=true;site();if(location.hash==='#admin')openAdmin()}
}catch(e){}})();
})();
